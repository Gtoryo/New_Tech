name: Réentraînement mensuel Prophet

on:
  schedule:
    - cron: '0 2 1 * *'   # 1er de chaque mois à 02h00 UTC
  workflow_dispatch:        # déclenchement manuel (tests)

permissions:
  contents: write           # nécessaire pour git push des .pkl

jobs:
  retrain:
    runs-on: ubuntu-latest

    env:
      DB_HOST:     ${{ secrets.DB_HOST }}
      DB_PORT:     ${{ secrets.DB_PORT }}
      DB_NAME:     ${{ secrets.DB_NAME }}
      DB_USER:     ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: pip install -r requirements-train.txt

      - name: Installation de CmdStan (moteur de calcul Prophet)
        run: |
          python -c "import cmdstanpy; cmdstanpy.install_cmdstan(overwrite=True)"
          python -c "
          import pathlib, shutil, prophet
          for p in (pathlib.Path(prophet.__file__).parent / 'stan_model').glob('cmdstan-*'):
              shutil.rmtree(p, ignore_errors=True)
          "

      - name: Tests automatisés (A1.3 C3 — validation modèle et pipeline ETL)
        run: pytest tests/ -v

      # Rafraîchit schema_ia à partir de schema_analytics, qui contient
      # l'historique chargé ET les commandes saisies via l'API depuis la
      # dernière exécution. Sans cette étape, Prophet se réentraînerait
      # chaque mois sur des séries identiques.
      - name: Agrégation des séries temporelles (schema_analytics → schema_ia)
        run: python src/aggregate.py

      - name: Réentraînement Prophet + sauvegarde prévisions en base
        run: python model/train.py

      - name: Commit des modèles .pkl mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/*.pkl

          if git diff --staged --quiet; then
            echo "Aucun modèle modifié — rien à committer."
            exit 0
          fi

          git commit -m "feat: réentraînement Prophet mensuel $(date +'%Y-%m')"

          # L'entraînement dure plusieurs minutes : la branche a pu avancer
          # entre le checkout et ce push (incident du 03/08/2026, push rejeté
          # en 'fetch first'). On rejoue le commit sur la tête distante.
          for essai in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "Push rejeté — nouvelle tentative ($essai/3)"
            sleep 10
          done

          echo "::error::Impossible de pousser les modèles après 3 tentatives."
          exit 1
